name: CI With Maven Cache (Optimized)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci-with-cache.yml'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # cache: 'maven' → tự động cache ~/.m2/repository
      - name: Set up JDK 17 with Maven Cache
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Cache HIT  → KHÔNG thấy "Downloading from central:"
      # Cache MISS → CÓ nhiều dòng "Downloading from central:"
      - name: Build and Test
        run: mvn clean install --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-jar
          path: target/*.jar
          retention-days: 1