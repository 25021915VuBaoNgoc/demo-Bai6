name: CI Without Cache (Baseline)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci-without-cache.yml'
  pull_request:
    branches: [ "main" ]

  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Bước 2: Cài Java (KHÔNG có cache)
      - name: Set up JDK 17 (No Cache)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # ❌ KHÔNG có: cache: 'maven'
          # => Maven sẽ tải toàn bộ dependency từ Maven Central mỗi lần

      # Bước 3: Build và test
      - name: Build with Maven (No Cache)
        run: mvn clean install --no-transfer-progress

      # Bước 4: Ghi lại thời gian kết thúc (để so sánh log)
      - name: Print completion time
        run: |
          echo "========================================="
          echo "Build completed WITHOUT cache"
          echo "Time: $(date)"
          echo "========================================="
          echo ""
          echo "NOTE: All dependencies were downloaded fresh from Maven Central."
          echo "Check 'Downloading from central:' lines in the build log above."